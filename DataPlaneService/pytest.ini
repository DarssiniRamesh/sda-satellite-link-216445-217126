[pytest]
# Pytest configuration for DataPlaneService

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for categorizing tests
markers =
    unit: Unit tests for isolated components
    integration: Integration tests requiring service interaction
    hardware: Tests requiring hardware/FPGA access (typically xfail or skip in CI)
    slow: Tests that take significant time to run
    websocket: WebSocket-related tests
    arq: ARQ behavior tests
    fec: FEC/CRC validation tests
    boundary: Boundary and edge case tests
    negative: Negative test cases

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    --maxfail=1
    -ra

# Coverage options (if pytest-cov is installed)
# --cov=app
# --cov-report=html
# --cov-report=term-missing

# Asyncio mode
asyncio_mode = auto

# Log settings for debugging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (requires pytest-timeout)
# timeout = 300
